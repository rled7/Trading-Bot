# Phase 6 (2026-06-12): production flipped to the C++ build.
# `docker compose up` starts the C++ engine + dashboard only.
# The Python/JS/C implementations remain as reference oracles behind profiles:
#   docker compose --profile oracle up algoforge-python
# S6 (background algo-discovery daemon) is opt-in behind its own profile — it
# autonomously proposes/promotes manifests into the registry, so it shouldn't
# start silently alongside the trading engine by default:
#   docker compose --profile s6 up algoforge-cpp-s6
services:
  algoforge-cpp:
    build:
      context: .
      dockerfile: Dockerfile.cpp-lang
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    volumes:
      - ./logs/cpp:/app/logs

  algoforge-cpp-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.cpp-lang
    command: ["./af_dashboard_server", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${AF_DASHBOARD_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped

  # Background algo-discovery daemon (S6, docs/s6_spec.md). Never places
  # orders — only observes bars and proposes/promotes candidate manifests
  # into the shared registry volume. Requires a reachable Ollama host; refuses
  # to start without --llm-host (see cpp/src/s6/s6_main.cpp).
  algoforge-cpp-s6:
    profiles: ["s6"]
    build:
      context: .
      dockerfile: Dockerfile.cpp-lang
    command: [
      "./af_s6_daemon",
      "--llm-host", "${AF_LLM_HOST:-http://host.docker.internal:11434}",
      "--symbol", "${AF_S6_SYMBOL:-EURUSD}",
      "--registry", "/app/registry"
    ]
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./registry:/app/registry
    restart: unless-stopped

  algoforge-python:
    profiles: ["oracle"]
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    volumes:
      - ./logs/python:/app/logs

  algoforge-js:
    profiles: ["oracle"]
    build:
      context: .
      dockerfile: Dockerfile.js
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    volumes:
      - ./logs/js:/app/logs

  algoforge-c:
    profiles: ["oracle"]
    build:
      context: .
      dockerfile: Dockerfile.c-lang
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    volumes:
      - ./logs/c:/app/logs
