[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algoforge"
version = "0.1.0"
description = "Algorithmic trading bot — Python implementation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["MetaTrader5>=5.0.45"]
dev  = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["algoforge*"]
